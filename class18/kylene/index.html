<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class18</title>
</head>
<body>
    <main>
        <section>
            <h1> Template demo </h1>

            <template id="message-template">
                <div class="message-box">
                    <h2>template title</h2>
                    <p>this content comes from a template</p>
                </div>
            </template>

            <div id="output"></div>
        </section>

        <section>
            <h1>world cup teams</h1>
            <template id="team-template">
                <article class="team-card">
                    <h2 class="team-name"></h2>
                    <ul>
                        <li>
                            <p class="team-group"></p>
                        </li>
                        <li>
                            <p class="team-points"></p>
                        </li>
                    </ul>
                </article>
            </template>

            <div id="teams-container"></div>
        </section>
    </main>

    <script src="notes.js"></script>
</body>
</html>
