<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 12</title>

    <script type="module" src="notes/notes.js"></script>
    <script type="module" src="app.js"></script>
</head>
<body>
    <main>
        <section class="demo">
            <div class="container">
                <h1>Post Loader</h1>

                <div class="input-holder">
                    <input type="number" id="post-id-input" placeholder="Enter post ID" />
                    <button id="load-post-btn">Load Post</button>
                    <button id="clear-post-btn" disabled>Clear Post</button>
                </div>

                <p id="status">Click the button to load a post.</p>
                <div id="output"></div>
            </div>
        </section>


    </main>
</body>
</html>
