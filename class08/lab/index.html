<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class08 - Lab02</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Custom -->
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <main>
        <section class="banner">
            <div class="container">
                <h1>User dashboard</h1>
                <p>Lab assignment that builds a small dashboard that loads users from an external API and displays related posts for each user.</p>
            </div>
        </section>

        <section class="user-content">
            <div class="container">
                <div class="navigation-area d-flex gap-5">
                    <div class="status w-75">
                        <p class="text-uppercase text-success fw-medium fs-4" id="status">Ready to start</p>
                    </div>

                    <div class="btns-holder w-25 d-flex gap-2 justify-content-end">
                        <button class="btn btn-success">Load users</button>
                        <button class="btn btn-outline-success">Clear</button>
                    </div>
                </div>

                <div class="user-cards row" id="user-cards"></div>
            </div>
        </section>
    </main>
</body>
</html>
