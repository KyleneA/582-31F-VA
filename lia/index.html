<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kylene Anne Aguila - LIA </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <main>
        <section class="py-5">
            <div class="container" id="weather-section">
                <h1 class="fs-1">Your Weather</h1>
                <p id="status"></p>
            </div>
        </section>
        
        <section class="attribution py-1">
            <div class="container">
                <div class="d-flex gap-2 justify-content-center">
                    <p class="fs-6 fw-light text-center">
                        <a href="https://open-meteo.com/">
                            Weather data by Open-Meteo.com
                        </a>
                    </p>
    
                    <p class="fs-6 fw-light text-center">
                        <a href="https://gist.github.com/stellasphere/9490c195ed2b53c707087c8c2db4ec0c">
                            WMO weather interpretation code descriptions (& images) by stellasphere
                        </a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <template id="weather-display-template">
        <style>
            .weather-container {
                padding: 50px;
            }

            .heading-row {
                display: flex;
                margin-bottom: 30px;
                justify-content: center;
            }

            .heading {
                display: flex;
                text-align: center;
            }

            .location-heading {
                font-size: 24px;
                text-transform: capitalize;
            }
            .body{
                display: flex;
                gap: 20px;

                .description-img {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background-color: darkgray;
                    width: 25%;

                    .weather-text {
                        font-size: 20px;

                        p{
                            margin: 0;
                            margin-bottom: 10px;
                        }
                    }
                }
                
                .body-row {
                    display: flex;
                    width: 75%;
                    
                    .weather-info {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        width: 100%;
                        
                        
                        h3 {
                            font-size: 18px;
                            font-weight: 500;
                        }
                    }
                }
            }
        </style>
        <div class="weather-container p-5">
            <div class="heading-row">
                <div class="heading">
                    <h2 class="location-heading">Weather for latitude: , longitude:</h2>
                </div>
            </div>
            <div class="body">
                <div class="description-img">
                    <img src="" alt="" class="weather-img">
                    <div class="weather-text">
                        <p class="weather-desc">3</p>
                    </div>
                </div>
                
                <div class="body-row">
                    <div class="weather-info">
                        <h3 class="fs-5 fw-medium">Temperature: </h3>
                        <p class="temperature">18</p>
                    </div>
                    <div class="weather-info">
                        <h3 class="fs-5 fw-medium">Wind Direction: </h3>
                        <p class="wind-direction">245</p>
                    </div>
                    <div class="weather-info">
                        <h3 class="fs-5 fw-medium">Wind Speed: </h3>
                        <p class="wind-speed">15</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="./js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
