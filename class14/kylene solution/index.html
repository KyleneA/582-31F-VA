<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYLENE - PROJECT EXAM</title>
    

    <!-- BootStrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- BootStrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script type="module" src="./app.js"></script>
</head>
<body>
    <main>
        <section class="banner text-center">
            <div class="container">
                <div class="heading">
                    <h1> RETRO ARCADE TOURNAMENT </h1>
                    <p> You will find here information regarding the tournament and the related player registration. </p>
                </div>

                <div class="controls">
                    <div class="button-holder d-flex gap-5 mb-3 justify-content-center">
                        <button class="btn btn-primary w-25" id="load-tournaments">Load Tournaments</button>
                        <button class="btn btn-outline-primary w-25" id="clear">Clear</button>
                    </div>

                    <div class="status-msg">
                        <p class="fw-medium text-success" id="status" >READY TO LOAD</p>
                    </div>
                </div>
            </div>
        </section> 
        <!-- END OF BANNER SECTION -->

        <section class="tournament-info">
            <div class="container">
                <div class="search-input">
                    <h2 class="tournaments-h2">Tournaments</h2>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingInput" placeholder="Search by tournament name or by game title">
                        <label for="floatingInput">Search by tournament name or by game title</label>
                    </div>
                </div>
                <div class="row tournaments-grid"></div>
            </div>
        </section>
        <!-- END OF TOURNAMENT-INFO SECTION -->
    </main>
</body>
</html>
